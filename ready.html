<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a0f24">
<title>Finish Strong 2026 – Ready</title>
<link rel="preload" as="image" href="assets/art.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet">
<style>
  :root{
    --red:#e3141b;
    --red-deep:#8e0a10;
    --ink:#140910;
    --white:#fff;
    /* art is 1170 x 2397 */
    --ratio: 0.4881;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#2a0f24}
  body{overflow:hidden;-webkit-tap-highlight-color:transparent;touch-action:manipulation;
       user-select:none;-webkit-user-select:none;font-family:"Russo One","Arial Black",Arial,sans-serif}

  /* blurred copy fills any side gaps on unusual screens */
  .backdrop{position:fixed;inset:-40px;background:url(assets/art.webp) center/cover;filter:blur(24px) brightness(.6)}

  /* the artwork keeps its proportions; button & text are positioned in % of it */
  .art{
    position:absolute;top:0;left:50%;
    width:max(100vw, 100vh * var(--ratio));
    width:min(max(100vw, 100dvh * var(--ratio)), 100dvh * 0.62);
    aspect-ratio:1170/2397;
    transform:translateX(-50%);
    background:url(assets/art.webp) top center/100% auto no-repeat;
  }
  body.go .art{animation:rush .9s cubic-bezier(.2,.7,.2,1)}
  @keyframes rush{0%{transform:translateX(-50%) scale(1.07);filter:brightness(1.5)}100%{transform:translateX(-50%) scale(1);filter:none}}

  /* ---------- BUTTON (position from client's artwork) ---------- */
  .btn{
    position:absolute;left:24.89%;top:51.08%;width:48.89%;aspect-ratio:1;
    border:0;background:none;padding:0;cursor:pointer;border-radius:50%;
    animation:breathe 1.6s ease-in-out infinite;
  }
  .btn:focus-visible{outline:4px solid #fff;outline-offset:6px}
  .ring,.dome{position:absolute;display:block;pointer-events:none}
  .ring{inset:0;width:100%;height:100%;filter:drop-shadow(0 10px 18px rgba(0,0,0,.55))}
  .dome-wrap{position:absolute;left:16.06%;top:16.06%;width:68.03%;height:68.03%;border-radius:50%;overflow:hidden;
    transition:transform .09s ease, filter .09s ease;
    animation:glow 1.6s ease-in-out infinite}
  .dome{inset:0;width:100%;height:100%}
  /* light sweep across the red dome */
  .dome-wrap::after{content:"";position:absolute;inset:-20%;
    background:linear-gradient(115deg,transparent 38%,rgba(255,255,255,.55) 48%,rgba(255,255,255,.1) 54%,transparent 62%);
    transform:translateX(-120%);animation:sweep 2.6s ease-in-out infinite}
  /* ripples */
  .btn::before,.btn::after{content:"";position:absolute;inset:2%;border-radius:50%;pointer-events:none;
    border:3px solid rgba(255,255,255,.9);box-shadow:0 0 18px rgba(255,60,60,.8);opacity:0;
    animation:ripple 2s ease-out infinite}
  .btn::after{animation-delay:1s}

  .btn.pressed .dome-wrap{transform:scale(.93);filter:brightness(.82)}

  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
  @keyframes glow{0%,100%{box-shadow:0 0 0 rgba(255,40,40,0)}50%{box-shadow:0 0 40px 6px rgba(255,40,40,.75)}}
  @keyframes sweep{0%{transform:translateX(-120%)}55%,100%{transform:translateX(120%)}}
  @keyframes ripple{0%{transform:scale(1);opacity:.9}100%{transform:scale(1.45);opacity:0}}

  /* button leaves */
  body.go .btn{animation:launch .5s cubic-bezier(.5,0,.8,.4) forwards;pointer-events:none}
  body.go .btn::before,body.go .btn::after{display:none}
  @keyframes launch{0%{transform:scale(.95)}35%{transform:scale(1.12);opacity:1}100%{transform:scale(.2);opacity:0}}

  .shock{position:absolute;left:24.89%;top:51.08%;width:48.89%;aspect-ratio:1;border-radius:50%;
    border:6px solid #fff;opacity:0;pointer-events:none}
  body.go .shock{animation:shock .7s ease-out .1s}
  @keyframes shock{0%{transform:scale(.6);opacity:1}100%{transform:scale(2.4);opacity:0;border-width:1px}}
  .flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none}
  body.go .flash{animation:flash .45s ease-out .12s}
  @keyframes flash{0%{opacity:.85}100%{opacity:0}}

  /* ---------- READY SCREEN ---------- */
  .done{position:absolute;left:0;right:0;top:54%;text-align:center;pointer-events:none;visibility:hidden}
  body.go .done{visibility:visible}
  .done .l1,.done .l2{display:block;font-style:normal;transform:skewX(-10deg);line-height:.95;
    color:var(--red);-webkit-text-stroke:.08em #fff;paint-order:stroke fill;
    text-shadow:.05em .07em 0 var(--ink), .05em .07em .25em rgba(0,0,0,.6)}
  .done .l1{font-size:min(10vw, 5.2dvh);opacity:0}
  .done .l2{font-size:min(19vw, 9.8dvh);opacity:0}
  .done .sub{display:inline-block;margin-top:min(4vw,2dvh);padding:.45em 1.1em;border-radius:99px;
    background:rgba(20,9,16,.78);color:#fff;font-size:min(4.6vw,2.4dvh);letter-spacing:.04em;opacity:0}
  body.go .done .l1{animation:slideIn .45s cubic-bezier(.2,.8,.3,1.2) .45s forwards}
  body.go .done .l2{animation:slam .55s cubic-bezier(.2,.8,.3,1.3) .6s forwards}
  body.go .done .sub{animation:up .5s ease-out 1.1s forwards}
  body.go .done .l2::after{content:""}
  @keyframes slideIn{0%{opacity:0;transform:skewX(-10deg) translateX(-60vw)}100%{opacity:1;transform:skewX(-10deg) translateX(0)}}
  @keyframes slam{0%{opacity:0;transform:skewX(-10deg) scale(2.2)}60%{opacity:1;transform:skewX(-10deg) scale(.94)}100%{opacity:1;transform:skewX(-10deg) scale(1)}}
  @keyframes up{0%{opacity:0;transform:translateY(12px)}100%{opacity:1;transform:none}}
  /* after arriving, READY! keeps a gentle pulse */
  body.settled .done .l2{animation:beat 1.4s ease-in-out infinite;opacity:1}
  @keyframes beat{0%,100%{transform:skewX(-10deg) scale(1)}50%{transform:skewX(-10deg) scale(1.05)}}

  /* returning visitor: show ready screen instantly */
  body.instant .btn,body.instant .shock{display:none}
  body.instant .done{visibility:visible}
  body.instant .done .l1,body.instant .done .l2,body.instant .done .sub{opacity:1;animation:none}

  @media (prefers-reduced-motion:reduce){
    .btn,.dome-wrap,.dome-wrap::after,.btn::before,.btn::after{animation:none !important}
  }
</style>
</head>
<body>
  <div class="backdrop" aria-hidden="true"></div>
  <main class="art">
    <button class="btn" id="btn" type="button" aria-label="READY">
      <img class="ring" src="assets/ring.webp" alt="">
      <span class="dome-wrap"><img class="dome" src="assets/dome.webp" alt=""></span>
    </button>
    <div class="shock" aria-hidden="true"></div>
    <div class="done" aria-live="polite">
      <span class="l1">YOU'RE</span>
      <span class="l2">READY!</span>
      <span class="sub">Eyes on the big screen</span>
    </div>
  </main>
  <div class="flash" aria-hidden="true"></div>

<script>
const btn = document.getElementById("btn");
const KEY = "fs26_ready";
function remember(){ try{ localStorage.setItem(KEY, "1"); }catch(e){} }
function seen(){ try{ return localStorage.getItem(KEY) === "1"; }catch(e){ return false; } }

const press = () => btn.classList.add("pressed");
const release = () => btn.classList.remove("pressed");
btn.addEventListener("pointerdown", press);
btn.addEventListener("pointerup", release);
btn.addEventListener("pointerleave", release);
btn.addEventListener("pointercancel", release);

btn.addEventListener("click", () => {
  if(document.body.classList.contains("go")) return;
  if(navigator.vibrate) navigator.vibrate([30, 40, 90]);
  document.body.classList.add("go");
  remember();
  setTimeout(() => document.body.classList.add("settled"), 1300);
});

// already tapped on this phone → go straight to the ready screen
if(seen()) document.body.classList.add("instant", "settled");
// testing: add ?reset to the link to see the button again
if(location.search.includes("reset")){ try{ localStorage.removeItem(KEY); }catch(e){} document.body.classList.remove("instant","settled"); }
</script>
</body>
</html>
