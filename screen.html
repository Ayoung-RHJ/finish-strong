<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Final Sprint 2026 – LED Screen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,700;1,700;1,900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{--red:#e8323c;--red-hot:#ff2b2b;--ember:#3d0808;--black:#000;--white:#fff}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#000;color:#fff;overflow:hidden}
  body{font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif}
  body.idle-mouse{cursor:none}

  /* ---------- TABS (auto-hide) ---------- */
  #tabs{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:50;display:flex;gap:6px;
    background:rgba(25,25,25,.9);border:1px solid #333;border-radius:12px;padding:6px;transition:opacity .4s}
  body.idle-mouse #tabs{opacity:0;pointer-events:none}
  #tabs button{appearance:none;border:0;background:transparent;color:#bbb;font-family:inherit;font-size:20px;font-weight:700;
    padding:8px 20px;border-radius:8px;cursor:pointer}
  #tabs button.on{background:var(--red);color:#fff}
  #tabs button:focus-visible{outline:2px solid #fff}
  #tabs .start{background:#fff;color:#000;margin-left:10px}

  .scene{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    opacity:0;visibility:hidden;transition:opacity .6s, visibility 0s linear .6s}
  .scene.on{opacity:1;visibility:visible;transition:opacity .6s}

  /* ---------- QR TAB ---------- */
  #qrTab{gap:7vmin;padding:6vmin}
  .title{font-weight:900;font-style:italic;line-height:.84;font-size:17vmin}
  .title .yr{display:block;color:var(--red-hot)}
  .sub{margin-top:4vmin;font-weight:500;font-size:4.2vmin;line-height:1.2;color:#ddd;max-width:30ch}
  .qr-card{background:#fff;padding:3vmin;border-radius:2.4vmin;box-shadow:0 0 0 1.4vmin var(--red)}
  #qr{width:46vmin;height:46vmin}
  #qr img,#qr canvas{width:100% !important;height:100% !important;display:block}

  /* ---------- GAUGE TAB ---------- */
  .ring-wrap{position:relative;width:84vmin;height:84vmin}
  .ring-wrap svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  .tick{stroke:var(--ember);stroke-width:1.5;stroke-linecap:round}
  .tick.lit{stroke:var(--red-hot);filter:drop-shadow(0 0 .9px var(--red-hot))}
  .tick.head{stroke:#ffd0d0}
  .ring-text{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .rt-title{font-weight:900;font-style:italic;font-size:6.6vmin;line-height:.9;color:var(--red-hot)}
  .rt-loading{margin-top:2vmin;font-weight:700;font-size:4vmin;letter-spacing:.3em;padding-left:.3em;color:#ffb3b3}
  .rt-pct{font-weight:900;font-style:italic;font-size:19vmin;line-height:.95;font-variant-numeric:tabular-nums}
  .rt-count{font-weight:500;font-size:3.8vmin;color:#e6e6e6;font-variant-numeric:tabular-nums;min-height:1.2em}
  .rt-count b{font-weight:700;color:#fff}
  #gaugeTab.done .tick{stroke:#fff;filter:drop-shadow(0 0 1.2px #fff)}
  #gaugeTab.done .rt-loading{visibility:hidden}

  /* ---------- BLINK ---------- */
  #flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:40}
  #flash.go{animation:blink .9s steps(1,end) forwards}
  @keyframes blink{0%{opacity:1}14%{opacity:0}28%{opacity:1}42%{opacity:0}56%{opacity:1}100%{opacity:1}}
  #flash.out{opacity:0;transition:opacity .5s}

  /* ---------- FINISH TAB (client's image) ---------- */
  #finishTab{overflow:hidden}
  #finishTab img{width:100%;height:100%;object-fit:cover;object-position:center 15%;transform-origin:50% 90%}
  #finishTab.on img{animation:rush 14s cubic-bezier(.2,.6,.3,1) forwards}
  @keyframes rush{from{transform:scale(1.07)}to{transform:scale(1)}}
  .streaks{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen}
  .streak{position:absolute;height:.45vmin;border-radius:1vmin;background:linear-gradient(90deg,transparent,rgba(255,60,60,.9),#fff);
    animation:streak linear infinite;opacity:.8}
  @keyframes streak{from{transform:translateX(-40vw)}to{transform:translateX(140vw)}}

  @media (prefers-reduced-motion:reduce){#finishTab.on img,.streak{animation:none}}
</style>
</head>
<body>

<nav id="tabs">
  <button data-tab="qrTab" class="on">QR code</button>
  <button data-tab="gaugeTab">Gauge</button>
  <button data-tab="finishTab">Finish</button>
  <button class="start" id="startBtn">Start 60s</button>
</nav>

<!-- TAB 1: QR -->
<section class="scene on" id="qrTab">
  <div>
    <h1 class="title">FINAL<br>SPRINT<span class="yr">2026</span></h1>
    <p class="sub">Scan with your phone camera, then wait for the signal to tap READY!</p>
  </div>
  <div class="qr-card"><div id="qr"></div></div>
</section>

<!-- TAB 2: GAUGE -->
<section class="scene" id="gaugeTab">
  <div class="ring-wrap">
    <svg viewBox="0 0 100 100" id="ring" aria-hidden="true"></svg>
    <div class="ring-text">
      <div class="rt-title">FINAL SPRINT<br>2026</div>
      <div class="rt-loading">LOADING</div>
      <div class="rt-pct"><span id="pct">0</span>%</div>
      <div class="rt-count" id="countLine"><b id="count">0</b> agents ready</div>
    </div>
  </div>
</section>

  <div class="streaks" id="streaks"></div>
</section>

<div id="flash"></div>

<script>
/* ================== SETTINGS ================== */
const CONFIG = {
  PHONE_URL: "",          // link of ready.html. Leave empty if ready.html is in the same folder online
  DURATION_SECONDS: 60,   // gauge always reaches 100% after this
  SHOW_AGENT_COUNT: true, // fake "agents ready" counter under the %
  FAKE_TOTAL_AGENTS: 4000 // number the counter climbs to
};
/* ============================================== */

const $ = id => document.getElementById(id);

/* ---------- Tabs ---------- */
const tabs = document.querySelectorAll("#tabs button[data-tab]");
function showTab(id){
  document.querySelectorAll(".scene").forEach(s => s.classList.toggle("on", s.id === id));
  tabs.forEach(b => b.classList.toggle("on", b.dataset.tab === id));
  if(id === "finishTab"){ const img = document.querySelector("#finishTab img"); img.style.animation = "none"; void img.offsetWidth; img.style.animation = ""; }
}
tabs.forEach(b => b.addEventListener("click", () => { if(b.dataset.tab !== "gaugeTab") stopRun(); showTab(b.dataset.tab); }));

/* hide tabs + cursor when the mouse is still */
let mouseTimer;
function wake(){ document.body.classList.remove("idle-mouse"); clearTimeout(mouseTimer);
  mouseTimer = setTimeout(() => document.body.classList.add("idle-mouse"), 2500); }
document.addEventListener("mousemove", wake); wake();

/* ---------- QR ---------- */
(function(){
  const url = CONFIG.PHONE_URL || new URL("ready.html", location.href).href;
  if(window.QRCode) new QRCode($("qr"), { text: url, width: 600, height: 600, correctLevel: QRCode.CorrectLevel.M });
  else { $("qr").textContent = "QR needs internet to draw. Or set your own QR image."; $("qr").style.cssText += ";color:#000;font-size:3vmin"; }
})();

/* ---------- Gauge ticks ---------- */
const TICKS = 72, ticks = [];
(function(){
  const svg = $("ring"), ns = "http://www.w3.org/2000/svg";
  for(let i = 0; i < TICKS; i++){
    const a = (i / TICKS) * Math.PI * 2 - Math.PI / 2, l = document.createElementNS(ns, "line");
    l.setAttribute("x1", 50 + Math.cos(a) * 38); l.setAttribute("y1", 50 + Math.sin(a) * 38);
    l.setAttribute("x2", 50 + Math.cos(a) * 47); l.setAttribute("y2", 50 + Math.sin(a) * 47);
    l.setAttribute("class", "tick"); svg.appendChild(l); ticks.push(l);
  }
})();
if(!CONFIG.SHOW_AGENT_COUNT) $("countLine").style.visibility = "hidden";

function render(p){
  const lit = Math.round(p * TICKS);
  ticks.forEach((t, i) => { t.classList.toggle("lit", i < lit); t.classList.toggle("head", i === lit - 1 && p < 1); });
  $("pct").textContent = p >= 1 ? 100 : Math.floor(p * 100);
  // agents "join" fast at first, then slow down — feels real
  const c = Math.round(CONFIG.FAKE_TOTAL_AGENTS * (1 - Math.pow(1 - p, 2.2)));
  $("count").textContent = c.toLocaleString();
}

/* ---------- 60-second fake run ---------- */
let running = false, startT = 0, raf = 0, finishTimer = 0;
function progressAt(sec){
  const x = Math.min(1, sec / CONFIG.DURATION_SECONDS);
  // mostly steady with small surges, always increasing, exactly 1 at the end
  return Math.min(1, x + 0.018 * Math.sin(x * Math.PI * 7) * (1 - x));
}
function startRun(){
  stopRun();
  showTab("gaugeTab");
  $("gaugeTab").classList.remove("done");
  running = true; startT = performance.now(); let best = 0;
  const loop = now => {
    if(!running) return;
    const p = Math.max(best, progressAt(Math.max(0, (now - startT) / 1000))); best = p;
    render(p);
    if(p >= 1){ running = false; finish(); return; }
    raf = requestAnimationFrame(loop);
  };
  raf = requestAnimationFrame(loop);
}
function finish(){
  $("gaugeTab").classList.add("done");
  finishTimer = setTimeout(() => {
    const f = $("flash"); f.className = ""; void f.offsetWidth; f.classList.add("go");
    finishTimer = setTimeout(() => { showTab("finishTab"); f.className = "out"; }, 900);
  }, 700);
}
function stopRun(){
  running = false; cancelAnimationFrame(raf); clearTimeout(finishTimer);
  $("flash").className = ""; $("gaugeTab").classList.remove("done"); render(0);
}
$("startBtn").addEventListener("click", startRun);

/* ---------- Keyboard ---------- */
document.addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  if(k === " " || k === "enter"){ e.preventDefault(); startRun(); }
  else if(k === "1"){ stopRun(); showTab("qrTab"); }
  else if(k === "2"){ stopRun(); showTab("gaugeTab"); }
  else if(k === "3"){ stopRun(); showTab("finishTab"); }
  else if(k === "r"){ stopRun(); showTab("qrTab"); }
});
document.addEventListener("dblclick", e => {
  if(e.target.closest("#tabs")) return;
  if(!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
  else document.exitFullscreen();
});

/* speed streaks over the finish image */
(function(){
  const box = $("streaks");
  for(let i = 0; i < 18; i++){
    const s = document.createElement("div"); s.className = "streak";
    s.style.top = (62 + Math.random() * 38) + "vh"; s.style.width = (8 + Math.random() * 22) + "vw";
    s.style.animationDuration = (0.45 + Math.random() * 0.8) + "s"; s.style.animationDelay = (-Math.random() * 2) + "s";
    box.appendChild(s);
  }
})();
render(0);
</script>
</body>
</html>
