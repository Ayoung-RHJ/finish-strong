<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finish Strong 2026 – LED Screen</title>
<link rel="preload" as="image" href="assets/screen-bg-wide.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet">
<script src="assets/qrcode.js"></script>
<style>
  :root{--red:#e3141b;--red-hot:#ff2b2b;--ink:#140910;--white:#fff}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#1b0b18;overflow:hidden}
  body{font-family:"Russo One","Arial Black",Arial,sans-serif;color:#fff}
  body.idle-mouse{cursor:none}

  /* ---------- STAGE: artwork always covers the screen, overlays follow it ---------- */
  .backdrop{position:fixed;inset:-60px;background:url(assets/screen-bg-wide.webp) center/cover;filter:blur(30px) brightness(.55)}
  /* wide artwork: the 16:9 centre always fits, the extended sides fill wider screens */
  .wide{position:absolute;left:50%;top:50%;height:min(100vh, 100vw * 9 / 16);aspect-ratio:3520/1350;transform:translate(-50%,-50%)}
  .bg{position:absolute;inset:0;background:url(assets/screen-bg-wide.webp) center/100% 100% no-repeat;transform-origin:50% 70%}
  .stage{position:absolute;left:50%;top:0;height:100%;aspect-ratio:16/9;transform:translateX(-50%);container-type:size}
  body.rush .bg{animation:rush 1.1s cubic-bezier(.2,.7,.2,1)}
  @keyframes rush{0%{transform:scale(1.1);filter:brightness(1.6) saturate(1.3)}100%{transform:scale(1);filter:none}}

  .layer{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .6s, visibility 0s linear .6s}
  .layer.on{opacity:1;visibility:visible;transition:opacity .6s}

  /* shared title style (matches phone page) */
  .hl{display:block;transform:skewX(-10deg);line-height:.95;color:var(--red);
    -webkit-text-stroke:.07em #fff;paint-order:stroke fill;
    text-shadow:.05em .07em 0 var(--ink), .05em .07em .25em rgba(0,0,0,.6)}

  /* ---------- TABS ---------- */
  #tabs{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:50;display:flex;gap:6px;
    background:rgba(20,20,20,.88);border:1px solid #333;border-radius:12px;padding:6px;transition:opacity .4s;
    font-family:system-ui,Arial,sans-serif}
  body.idle-mouse #tabs{opacity:0;pointer-events:none}
  #tabs button{appearance:none;border:0;background:transparent;color:#bbb;font:700 17px system-ui,Arial,sans-serif;
    padding:8px 18px;border-radius:8px;cursor:pointer}
  #tabs button.on{background:var(--red);color:#fff}
  #tabs .start{background:#fff;color:#000;margin-left:10px}

  /* ---------- QR LAYER ---------- */
  #qr{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:3.2vmin;text-align:center;background:url(assets/qr-bg.webp) center 62%/cover no-repeat}
  #qr::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 45% 55% at 50% 58%,rgba(10,4,10,.35),transparent 70%);pointer-events:none}
  #qr > *{position:relative}
  .qr-title .hl{font-size:11vmin;white-space:nowrap}
  .qr-title .hl.small{font-size:5.6vmin;margin-bottom:.6vmin}
  .qr-card{width:38vmin;background:#fff;border-radius:2.6vmin;padding:2.4vmin;
    box-shadow:0 0 0 1.1vmin var(--red), 0 0 5vmin 1.5vmin rgba(255,43,43,.55), 0 2.5vmin 5vmin rgba(0,0,0,.5);
    animation:float 3s ease-in-out infinite}
  .qr-card svg{display:block;width:100%;height:auto}
  .qr-card .cap{color:var(--ink);font-size:2.3vmin;margin-top:1.3vmin}
  .qr-hint{display:inline-block;background:rgba(20,9,16,.8);border-radius:99px;padding:1.3vmin 3.4vmin;font-size:2.8vmin;letter-spacing:.03em}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.2vmin)}}

  /* ---------- GAUGE LAYER ---------- */
  #gauge::before{content:"";position:absolute;inset:0;
    background:radial-gradient(ellipse 55% 60% at 50% 70%, rgba(10,4,10,.55), transparent 70%)}
  .ring-wrap{position:absolute;left:50%;top:69cqh;width:54cqh;height:54cqh;transform:translate(-50%,-50%)}
  .disc{position:absolute;inset:14%;border-radius:50%;background:rgba(20,8,18,.72);
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);box-shadow:inset 0 0 0 .3cqh rgba(255,255,255,.15)}
  .ring-wrap svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  .tick{stroke:rgba(255,255,255,.28);stroke-width:1.6;stroke-linecap:round}
  .tick.lit{stroke:var(--red-hot);filter:drop-shadow(0 0 1px var(--red-hot))}
  .tick.head{stroke:#fff}
  .ring-text{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .rt-loading{font-size:2.6cqh;letter-spacing:.35em;padding-left:.35em;color:#ffc2c2}
  .rt-pct{font-size:13cqh;line-height:1;margin:.6cqh 0;font-variant-numeric:tabular-nums}
  .rt-count{font-family:system-ui,Arial,sans-serif;font-weight:600;font-size:2.4cqh;color:#eee;font-variant-numeric:tabular-nums}
  .rt-count b{color:#fff}
  #gauge.done .tick{stroke:#fff;filter:drop-shadow(0 0 1.4px #fff)}
  #gauge.done .rt-loading{visibility:hidden}

  #flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:40}
  #flash.go{animation:blink .9s steps(1,end) forwards}
  @keyframes blink{0%{opacity:1}14%{opacity:0}28%{opacity:1}42%{opacity:0}56%{opacity:1}100%{opacity:1}}
  #flash.out{opacity:0;transition:opacity .6s}

  /* ---------- FINISH LAYER: crossed chequered flags ---------- */
  .flags{position:absolute;left:50%;top:100cqh;width:0;height:0}
  .pole{position:absolute;bottom:0;width:1cqw;height:54cqh;margin-left:-.5cqw;border-radius:.5cqw;transform-origin:50% 100%;
    background:linear-gradient(90deg,#8d8d8d,#fff 45%,#bdbdbd 60%,#6d6d6d);box-shadow:0 0 1cqw rgba(0,0,0,.5)}
  .pole::before{content:"";position:absolute;left:50%;top:-1.3cqw;width:1.9cqw;height:1.9cqw;margin-left:-.95cqw;border-radius:50%;
    background:radial-gradient(circle at 35% 35%,#fff,#e6b800 55%,#8a6a00)}
  .pole.l{left:7cqw;transform:rotate(-30deg)}
  .pole.r{left:-7cqw;transform:rotate(30deg)}
  .flag{position:absolute;top:1cqw;width:22cqw;height:14cqw;display:flex;filter:drop-shadow(0 .8cqw 1cqw rgba(0,0,0,.45))}
  .pole.l .flag{right:.9cqw;flex-direction:row-reverse;transform-origin:100% 0;transform:rotate(38deg)}
  .pole.r .flag{left:.9cqw;transform-origin:0 0;transform:rotate(-38deg)}
  .slice{flex:1;height:100%;
    background:repeating-conic-gradient(#111 0 25%, #f5f5f5 0 50%);background-size:5.5cqw 5.5cqw;
    background-position:calc(var(--i) * -22cqw / 40) 0;position:relative;
    animation:wave 1.1s ease-in-out infinite;animation-delay:calc(var(--i) * -.045s)}
  .slice::after{content:"";position:absolute;inset:0;background:#000;opacity:0;animation:shade 1.1s ease-in-out infinite;animation-delay:inherit}
  @keyframes wave{0%,100%{transform:translateY(calc(var(--a) * -1%))}50%{transform:translateY(calc(var(--a) * 1%))}}
  @keyframes shade{0%,100%{opacity:0}50%{opacity:.28}}

  #finish .pole{visibility:hidden}
  body.flags-in #finish .pole{visibility:visible}
  body.flags-in #finish .pole.l{animation:swingL 1s cubic-bezier(.3,1.5,.5,1) both}
  body.flags-in #finish .pole.r{animation:swingR 1s cubic-bezier(.3,1.5,.5,1) .08s both}
  @keyframes swingL{from{transform:rotate(95deg)}to{transform:rotate(-30deg)}}
  @keyframes swingR{from{transform:rotate(-95deg)}to{transform:rotate(30deg)}}

  .burst{position:absolute;left:0;top:-12cqw;width:30cqw;height:30cqw;margin:-15cqw 0 0 -15cqw;border-radius:50%;
    background:radial-gradient(circle,rgba(255,255,255,.95),rgba(255,80,80,.5) 30%,transparent 65%);opacity:0}
  body.flags-in .burst{animation:burst 1s ease-out .75s}
  @keyframes burst{0%{opacity:1;transform:scale(.2)}100%{opacity:0;transform:scale(2.2)}}
  .spark{position:absolute;left:0;top:-12cqw;width:.9cqw;height:.9cqw;border-radius:2px;opacity:0}
  body.flags-in .spark{animation:spark 1.4s cubic-bezier(.1,.7,.3,1) .8s forwards}
  @keyframes spark{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(540deg)}}

  @media (prefers-reduced-motion:reduce){.slice,.slice::after,.qr-card{animation:none}}
</style>
</head>
<body>
<nav id="tabs">
  <button data-tab="qr" class="on">QR code</button>
  <button data-tab="gauge">Gauge</button>
  <button data-tab="finish">Finish</button>
  <button class="start" id="startBtn">Start 60s</button>
</nav>

<div class="backdrop" aria-hidden="true"></div>

<!-- TAB 1: QR (full screen, clean track) -->
<section class="layer on" id="qr">
  <div class="qr-title">
    <span class="hl small">SCAN THE QR</span>
    <span class="hl">GET READY!</span>
  </div>
  <div class="qr-card"><div id="qrBox"></div><div class="cap">Open your phone camera</div></div>
  <p class="qr-hint">Wait for the signal, then tap READY together</p>
</section>

<div class="wide">
<div class="bg"></div>
<div class="stage">


  <!-- TAB 2: GAUGE -->
  <section class="layer" id="gauge">
    <div class="ring-wrap">
      <div class="disc"></div>
      <svg viewBox="0 0 100 100" id="ring" aria-hidden="true"></svg>
      <div class="ring-text">
        <div class="rt-loading">LOADING</div>
        <div class="rt-pct"><span id="pct">0</span>%</div>
        <div class="rt-count" id="countLine"><b id="count">0</b> agents ready</div>
      </div>
    </div>
  </section>

  <!-- TAB 3: FINISH -->
  <section class="layer" id="finish">
    <div class="flags" id="flags">
      <div class="burst"></div>
      <div class="pole l"><div class="flag"></div></div>
      <div class="pole r"><div class="flag"></div></div>
    </div>
  </section>
</div>
</div>
<div id="flash"></div>

<script>
/* ================== SETTINGS ================== */
const CONFIG = {
  PHONE_URL: "",          // link of ready.html. Leave empty if it sits next to this file online
  DURATION_SECONDS: 60,   // gauge always reaches 100% after this
  SHOW_AGENT_COUNT: true, // fake "agents ready" counter
  FAKE_TOTAL_AGENTS: 3500 // number the counter climbs to
};
/* ============================================== */
const $ = id => document.getElementById(id);

/* ---------- Tabs ---------- */
const tabBtns = document.querySelectorAll("#tabs button[data-tab]");
function showTab(id){
  document.querySelectorAll(".layer").forEach(s => s.classList.toggle("on", s.id === id));
  tabBtns.forEach(b => b.classList.toggle("on", b.dataset.tab === id));
  document.body.classList.remove("flags-in", "rush");
  if(id === "finish"){ void document.body.offsetWidth; document.body.classList.add("rush", "flags-in"); }
}
tabBtns.forEach(b => b.addEventListener("click", () => { stopRun(); showTab(b.dataset.tab); }));
let mouseTimer;
function wake(){ document.body.classList.remove("idle-mouse"); clearTimeout(mouseTimer);
  mouseTimer = setTimeout(() => document.body.classList.add("idle-mouse"), 2500); }
document.addEventListener("mousemove", wake); wake();

/* ---------- QR (drawn locally, works offline) ---------- */
(function(){
  const url = CONFIG.PHONE_URL || new URL("ready.html", location.href).href;
  try{
    const qr = qrcode(0, "M"); qr.addData(url); qr.make();
    $("qrBox").innerHTML = qr.createSvgTag({ cellSize: 8, margin: 0, scalable: true });
  }catch(e){ $("qrBox").textContent = url; $("qrBox").style.color = "#000"; }
})();

/* ---------- Gauge ---------- */
const TICKS = 72, ticks = [];
(function(){
  const svg = $("ring"), ns = "http://www.w3.org/2000/svg";
  for(let i = 0; i < TICKS; i++){
    const a = (i / TICKS) * Math.PI * 2 - Math.PI / 2, l = document.createElementNS(ns, "line");
    l.setAttribute("x1", 50 + Math.cos(a) * 40); l.setAttribute("y1", 50 + Math.sin(a) * 40);
    l.setAttribute("x2", 50 + Math.cos(a) * 48); l.setAttribute("y2", 50 + Math.sin(a) * 48);
    l.setAttribute("class", "tick"); svg.appendChild(l); ticks.push(l);
  }
})();
if(!CONFIG.SHOW_AGENT_COUNT) $("countLine").style.visibility = "hidden";
function render(p){
  const lit = Math.round(p * TICKS);
  ticks.forEach((t, i) => { t.classList.toggle("lit", i < lit); t.classList.toggle("head", i === lit - 1 && p < 1); });
  $("pct").textContent = p >= 1 ? 100 : Math.floor(p * 100);
  $("count").textContent = Math.round(CONFIG.FAKE_TOTAL_AGENTS * (1 - Math.pow(1 - p, 2.2))).toLocaleString();
}

/* ---------- Flags (built from slices so they wave) ---------- */
document.querySelectorAll(".flag").forEach(f => {
  const N = 40;
  for(let i = 0; i < N; i++){
    const s = document.createElement("span"); s.className = "slice";
    s.style.setProperty("--i", i);
    s.style.setProperty("--a", (1.5 + i * 0.2).toFixed(2)); // waves more toward the free end
    f.appendChild(s);
  }
});
(function(){
  const box = $("flags"), colors = ["#fff", "#111", "#ff2b2b", "#ffd24a"];
  for(let i = 0; i < 40; i++){
    const s = document.createElement("span"); s.className = "spark";
    const ang = Math.random() * Math.PI * 2, dist = 10 + Math.random() * 28;
    s.style.setProperty("--dx", (Math.cos(ang) * dist).toFixed(1) + "cqw");
    s.style.setProperty("--dy", (Math.sin(ang) * dist * 0.7).toFixed(1) + "cqw");
    s.style.background = colors[i % colors.length];
    s.style.animationDelay = (0.8 + Math.random() * 0.2) + "s";
    box.appendChild(s);
  }
})();

/* ---------- 60-second fake run ---------- */
let running = false, startT = 0, raf = 0, timer = 0;
function progressAt(sec){
  const x = Math.min(1, sec / CONFIG.DURATION_SECONDS);
  return Math.min(1, x + 0.018 * Math.sin(x * Math.PI * 7) * (1 - x));
}
function startRun(){
  stopRun(); showTab("gauge"); $("gauge").classList.remove("done");
  running = true; startT = performance.now(); let best = 0;
  const loop = now => {
    if(!running) return;
    const p = Math.max(best, progressAt(Math.max(0, (now - startT) / 1000))); best = p; render(p);
    if(p >= 1){ running = false; finish(); return; }
    raf = requestAnimationFrame(loop);
  };
  raf = requestAnimationFrame(loop);
}
function finish(){
  $("gauge").classList.add("done");
  timer = setTimeout(() => {
    const f = $("flash"); f.className = ""; void f.offsetWidth; f.classList.add("go");
    timer = setTimeout(() => { showTab("finish"); f.className = "out"; }, 900);
  }, 700);
}
function stopRun(){
  running = false; cancelAnimationFrame(raf); clearTimeout(timer);
  $("flash").className = ""; $("gauge").classList.remove("done"); render(0);
}
$("startBtn").addEventListener("click", startRun);

/* ---------- Keyboard ---------- */
document.addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  if(k === " " || k === "enter"){ e.preventDefault(); startRun(); }
  else if(k === "1" || k === "r"){ stopRun(); showTab("qr"); }
  else if(k === "2"){ stopRun(); showTab("gauge"); }
  else if(k === "3"){ stopRun(); showTab("finish"); }
});
document.addEventListener("dblclick", e => {
  if(e.target.closest("#tabs")) return;
  if(!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
  else document.exitFullscreen();
});
render(0);
</script>
</body>
</html>
